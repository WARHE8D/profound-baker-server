# Local Postgres for development. Credentials come from .env (copy .env.example); compose reads it automatically.

services:

  postgres:
    image: postgres:17-alpine
    container_name: baker
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${DB_NAME:-baker-db}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env (copy .env.example)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql


volumes:
  postgres_data:
