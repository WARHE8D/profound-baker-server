# Production stack for the single VPS: Caddy (TLS, reverse proxy) -> app -> Postgres and the web app (SPA),
# plus nightly backups and observability (Prometheus, Tempo, Grafana; #26).
#   docker compose -f docker-compose.prod.yml up -d --build
# Values come from .env next to this file (copy .env.example). Only Caddy publishes ports to the internet;
# Grafana is published on the server's loopback only (an SSH tunnel away, see README.md "Observability"),
# and everything else is reachable only on the internal network.

# Own project name so this stack never shares containers or volumes with the dev docker-compose.yml.
name: sugarcrumbs-prod

services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: sugarcrumbs/baker:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?Set DB_NAME in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_STORAGE_PATH: /data/uploads
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS in .env}
      APP_JWT_PRIVATE_KEY: ${APP_JWT_PRIVATE_KEY:?Set APP_JWT_PRIVATE_KEY in .env}
      # Only needed for the first start, which creates the Owner; optional afterwards.
      APP_OWNER_EMAIL: ${APP_OWNER_EMAIL:-}
      APP_OWNER_INITIAL_PASSWORD: ${APP_OWNER_INITIAL_PASSWORD:-}
      APP_OWNER_TIME_ZONE: ${APP_OWNER_TIME_ZONE:-UTC}
      # Traces go to Tempo over OTLP/HTTP (#26). Unset (dev, tests), spans are made but not sent anywhere.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    volumes:
      - uploads:/data/uploads
    # Health check is defined in the Dockerfile (Actuator readiness on the internal port 9080).

  # The SPA, built and published by profound-baker-web (its Dockerfile): static files behind Caddy below,
  # on the same domain as the API. Update with `docker compose -f docker-compose.prod.yml pull web` and
  # `up -d web`; WEB_IMAGE_TAG pins a version (a commit SHA) instead of the latest build of main.
  web:
    image: ghcr.io/warhe8d/profound-baker-web:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data
      - /config
    # Health check is defined in its Dockerfile.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy serves uploaded images itself; read-only, only the app writes to this volume.
      - uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly pg_dump + uploads archive, kept BACKUP_RETENTION_DAYS here and copied off the server encrypted.
  # Restore runbook: README.md, "Backups and restore".
  backup:
    build: ./infra/backup
    image: sugarcrumbs/backup:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:?Set DB_NAME in .env}
      PGUSER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${BACKUP_TZ:-UTC}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:-}
    volumes:
      # A directory on the host, so backups can be listed and copied without docker commands.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - uploads:/data/uploads:ro
    # Health check in infra/backup/Dockerfile: unhealthy once the last good backup is over 26 hours old.

  # --- Observability (#26, CLAUDE.md §6). Config and dashboards are files in infra/, never set up by hand.

  prometheus:
    image: prom/prometheus:v3.9.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      # Tempo writes its service-graph metrics here; exemplars link latency points to their traces.
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus

  # Tempo runs as uid 10001 and a fresh named volume belongs to root: hand it over once, then exit.
  tempo-init:
    image: grafana/tempo:2.9.0
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempo_data:/var/tempo

  tempo:
    image: grafana/tempo:2.9.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:12.3.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-overview.json
    # Loopback only: reach it with `ssh -L 3000:127.0.0.1:3000 <server>`, then http://localhost:3000.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
  prometheus_data:
  tempo_data:
  grafana_data:
