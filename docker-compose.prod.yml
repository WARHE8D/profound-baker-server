# Production stack for the single VPS: Caddy (TLS, reverse proxy) -> app -> Postgres, plus nightly backups.
#   docker compose -f docker-compose.prod.yml up -d --build
# Values come from .env next to this file (copy .env.example). Only Caddy publishes ports;
# the app and Postgres are reachable only on the internal network.

# Own project name so this stack never shares containers or volumes with the dev docker-compose.yml.
name: sugarcrumbs-prod

services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: sugarcrumbs/baker:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?Set DB_NAME in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_STORAGE_PATH: /data/uploads
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS in .env}
      APP_JWT_PRIVATE_KEY: ${APP_JWT_PRIVATE_KEY:?Set APP_JWT_PRIVATE_KEY in .env}
      # Only needed for the first start, which creates the Owner; optional afterwards.
      APP_OWNER_EMAIL: ${APP_OWNER_EMAIL:-}
      APP_OWNER_INITIAL_PASSWORD: ${APP_OWNER_INITIAL_PASSWORD:-}
      APP_OWNER_TIME_ZONE: ${APP_OWNER_TIME_ZONE:-UTC}
    volumes:
      - uploads:/data/uploads
    # Health check is defined in the Dockerfile (Actuator readiness on the internal port 9080).

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy serves uploaded images itself; read-only, only the app writes to this volume.
      - uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly pg_dump + uploads archive, kept BACKUP_RETENTION_DAYS here and copied off the server encrypted.
  # Restore runbook: README.md, "Backups and restore".
  backup:
    build: ./infra/backup
    image: sugarcrumbs/backup:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:?Set DB_NAME in .env}
      PGUSER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${BACKUP_TZ:-UTC}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:-}
    volumes:
      # A directory on the host, so backups can be listed and copied without docker commands.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - uploads:/data/uploads:ro
    # Health check in infra/backup/Dockerfile: unhealthy once the last good backup is over 26 hours old.

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
