# Test-only overrides, layered on top of the main application.properties (classpath:/config/ wins).
# Integration tests log in and check out many times from 127.0.0.1, so the production limits would turn
# unrelated tests into 429s. RateLimitTests sets real limits for itself.
app.rate-limit.login.capacity=100000
app.rate-limit.checkout.capacity=100000
