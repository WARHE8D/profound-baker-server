# Local development: SPRING_PROFILES_ACTIVE=dev, or ./mvnw -pl app spring-boot:run -Dspring-boot.run.profiles=dev
# Loads the repo-root .env, the same file docker compose reads, so local credentials live in one place.
# Both paths are listed because the working directory is the repo root (IntelliJ) or app/ (spring-boot:run).
# Real environment variables still win over values from .env.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.jpa.show-sql=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
