spring.application.name=server

# No profile is active by default. Run with SPRING_PROFILES_ACTIVE=dev locally (reads the repo-root .env)
# and SPRING_PROFILES_ACTIVE=prod on the server. Secrets only ever come from env vars; see .env.example.

# Database. Deliberately no defaults: a missing variable must stop the app, not point it at some other DB.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway (one schema + migration location per module, see FlywayModulesConfig).
# Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Image storage on local disk (ImageStorageService).
app.storage.local-path=${APP_STORAGE_PATH:./uploads}
app.storage.public-base-url=/uploads

# Pending bookings older than this are auto-cancelled (StaleBookingCleanupJob).
app.booking.pending-hold-hours=${APP_BOOKING_PENDING_HOLD_HOURS:24}

# Owner tokens (identity module, JwtProperties): access tokens last 15m (they cannot be revoked), refresh tokens
# 14d and rotate on every use; those defaults live in JwtProperties. The signing key is set only in prod
# (APP_JWT_PRIVATE_KEY); elsewhere a throwaway key is generated at startup.
app.security.jwt.issuer=sugarcrumbs

# The SPA origin allowed by CORS. Enforced from #13.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Actuator lives on its own port, which the reverse proxy never routes to, so it is reachable only from
# inside the Docker network (health checks, later Prometheus). Only the endpoints listed here are exposed.
management.server.port=${MANAGEMENT_PORT:9080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
