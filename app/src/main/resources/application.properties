# Also the service name on every trace span and the `application` tag on every metric (#26).
spring.application.name=baker

# No profile is active by default. Run with SPRING_PROFILES_ACTIVE=dev locally (reads the repo-root .env)
# and SPRING_PROFILES_ACTIVE=prod on the server. Secrets only ever come from env vars; see .env.example.

# Database. Deliberately no defaults: a missing variable must stop the app, not point it at some other DB.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway (one schema + migration location per module, see FlywayModulesConfig).
# Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Image storage on local disk (ImageStorageService).
app.storage.local-path=${APP_STORAGE_PATH:./uploads}
app.storage.public-base-url=/uploads

# Pending orders older than this are auto-cancelled (StaleOrderCleanupJob).
app.order.pending-hold-hours=${APP_ORDER_PENDING_HOLD_HOURS:24}
# Checkout limits (OrderProperties): distinct items per order, and units of one item per order. Bigger orders
# are arranged with the baker directly. Exceeding either is a 400.
app.order.max-lines=20
app.order.max-quantity-per-line=100
# A guest may cancel through their magic link until this many hours before pickup; later, they call the baker.
app.order.guest-cancel-cutoff-hours=24

# Owner tokens (identity module, JwtProperties): access tokens last 15m (they cannot be revoked), refresh tokens
# 14d and rotate on every use; those defaults live in JwtProperties. The signing key is set only in prod
# (APP_JWT_PRIVATE_KEY); elsewhere a throwaway key is generated at startup.
app.security.jwt.issuer=sugarcrumbs

# The Owner created on first start when none exists (OwnerBootstrap). Without an Owner and without these the
# app refuses to start. Only read while no Owner exists; remove the password from the environment afterwards.
app.owner.email=${APP_OWNER_EMAIL:}
app.owner.initial-password=${APP_OWNER_INITIAL_PASSWORD}
# The bakery's IANA time zone for the new Owner (slots are local times in it); editable later via the profile API.
app.owner.time-zone=${APP_OWNER_TIME_ZONE:UTC}

# The SPA origin(s) allowed by CORS: comma-separated exact origins, no wildcards (WebEdgeConfig).
# Empty means browsers on other origins are refused.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Per-client-IP rate limits (RateLimitFilter): <capacity> requests per <period>, refilled gradually.
app.rate-limit.login.capacity=5
app.rate-limit.login.period=1m
app.rate-limit.checkout.capacity=10
app.rate-limit.checkout.period=10m
app.rate-limit.magic-link.capacity=30
app.rate-limit.magic-link.period=10m

# OpenAPI (/v3/api-docs, which the SPA generates its client types from; see OpenApiConfig). Responses are JSON,
# not springdoc's default */*, and the spec's version is the build's (Maven fills in @project.version@).
springdoc.default-produces-media-type=application/json
app.api.version=@project.version@
# Spring reads a Pageable from flat, optional page/size/sort query parameters, so document it that way, not as one
# required "pageable" object a generated client would send as ?pageable[page]=1 (#54). Global, so the business
# modules need no springdoc @ParameterObject.
springdoc.default-flat-param-object=true

# Every list endpoint is paginated; nobody may ask for more than this per page.
spring.data.web.pageable.max-page-size=100

# Actuator lives on its own port, which the reverse proxy never routes to, so it is reachable only from
# inside the Docker network (health checks, Prometheus). Only the endpoints listed here are exposed.
management.server.port=${MANAGEMENT_PORT:9080}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Observability (#26). Metrics: Prometheus scrapes /actuator/prometheus; the OTLP metrics registry that the
# OpenTelemetry starter brings along is switched off, so nothing pushes metrics to a collector that isn't there.
management.otlp.metrics.export.enabled=false
management.metrics.tags.application=${spring.application.name}
# Latency buckets for request timings, so Grafana can compute p50/p95/p99 across instances and time ranges.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Traces: one baker's traffic is small, so every request is kept. They are only sent somewhere when
# management.opentelemetry.tracing.export.otlp.endpoint is set (docker-compose.prod.yml points it at Tempo).
management.tracing.sampling.probability=1.0
# Database spans (datasource-micrometer): one per connection checkout and per statement, none per ResultSet row.
# The query text in a span is sanitized (literals become ?) and parameter values are never recorded, so guests'
# names, emails and phone numbers stay out of traces.
jdbc.includes=connection,query
jdbc.datasource-proxy.include-parameter-values=false
# Every log line written during a request carries its trace, span and request id (RequestIdFilter), so a
# log line leads to its trace in Tempo and an X-Request-Id a client reports leads to its log lines.
logging.pattern.correlation=[%X{traceId:-},%X{spanId:-},%X{requestId:-}] 
