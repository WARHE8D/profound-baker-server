# Production: SPRING_PROFILES_ACTIVE=prod. Every value comes from env vars set by docker compose
# (see .env.example) and nothing has a default, so a missing variable fails startup instead of
# falling back to a development value.
spring.jpa.show-sql=false

# Behind Caddy: trust X-Forwarded-For/-Proto from internal (Docker network) addresses only, so the app
# sees the real client IP (rate limiting, #13) and scheme. Tomcat's defaults already limit trust to
# private ranges; the app port is never published, so nothing else can reach it.
server.forward-headers-strategy=native

app.storage.local-path=${APP_STORAGE_PATH}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# RS256 signing key for the Owner's access tokens: PKCS#8, as PEM or base64 DER. No default, so prod never
# runs on a throwaway key that would log the Owner out on every restart.
app.security.jwt.private-key=${APP_JWT_PRIVATE_KEY}
