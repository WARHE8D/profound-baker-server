# Builds every module and runs the full test suite (unit, Spring Modulith boundaries, and
# Testcontainers integration tests against Postgres) on every push and pull request.
# Must pass before merging.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or PR supersedes the running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ./mvnw verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The hosted runner has Docker, which Testcontainers uses for the throwaway Postgres.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  # The stack profound-baker-web's e2e tests run against (docker-compose.e2e.yml on top of the production
  # file), started empty: a change to either compose file that breaks it fails here.
  e2e-stack:
    name: e2e stack starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E: docker compose -f docker-compose.prod.yml -f docker-compose.e2e.yml --env-file .env.e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start the stack
        run: $E2E up -d --build --wait --wait-timeout 300

      - name: Sign in as the e2e Owner, through the API and through Caddy
        run: |
          for base in http://localhost:8080 http://localhost:8081; do
            curl -fsS -o /dev/null -X POST "$base/api/auth/login" -H 'Content-Type: application/json' \
              -d '{"email":"owner@e2e.test","password":"e2e-owner-password"}'
          done
          curl -fsS -o /dev/null http://localhost:8081/

      - name: Logs
        if: failure()
        run: $E2E logs --no-color

      - name: Stop
        if: always()
        run: $E2E down -v
