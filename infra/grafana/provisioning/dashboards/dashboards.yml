# Loads every dashboard in infra/grafana/dashboards (mounted at /var/lib/grafana/dashboards) into the
# "SugarCrumbs" folder (#26). Edits made in the UI are not saved: change the JSON file and redeploy.
apiVersion: 1

providers:
  - name: sugarcrumbs
    folder: SugarCrumbs
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
