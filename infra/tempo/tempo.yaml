# Tempo (#26): stores the app's traces (OTLP) on local disk for a week. Its metrics generator turns spans
# into service-graph and RED metrics and writes them to Prometheus, which Grafana's service graph reads:
# HTTP request -> module calls (Spring Modulith) -> database today; gateway -> service -> service once
# modules become services (CLAUDE.md §3, stage 2).

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        # Tempo listens on localhost only unless told otherwise; the app reaches it over the Docker network.
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
